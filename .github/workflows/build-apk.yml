
name: Build Demo Buddy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DemoBuddyAndroid_Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Unpack Android project
        run: |
          mkdir -p appsrc
          unzip -q DemoBuddyAndroid_Source.zip -d appsrc
          test -f appsrc/settings.gradle.kts

      - name: Build APK
        run: gradle -p appsrc --no-daemon assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: DemoBuddy-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
